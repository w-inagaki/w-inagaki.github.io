<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポートフォリオサイト|caresend制作概要</title>
    <link rel="icon" href="../images/favicon.ico" type="image/x-icon">

    <meta name="robots" content="noindex">

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">

    <script src="../js/script.js" defer></script>
</head>
<body>
    <div class="wrap">

        <header id="header" class="header">
            <div class="hamburger">
                <div class="header-logo"><a href="#"><img src="../images/wa.png" alt="和" width="40"></a></div>
                <p class="btn-gNav">
                    <span></span>
                    <span></span>
                    <span></span>
                </p>
                <nav class="gNav">
                    <ul class="header-nav">
                        <li class="header-nav-list"><a href="../index.html">Top</a></li>
                        <li class="header-nav-list"><a href="../#works">Works</a></li>
                        <li class="header-nav-list"><a href="#">About me</a></li>
                    </ul><!-- /.header-nav -->
                </nav>
            </div><!-- /.hamburger -->
        </header><!-- /#header .header -->

        <div class="background">
            <img class="mv-pc" src="../images/mv.png" alt="メインビジュアル">
            <img class="mv-ipad" src="../images/mv_ipad.png" alt="メインビジュアル">
        </div><!-- /.background -->

        <section class="work">
            <div class="work-inner">
            <h2 class="work-ttl">Work</h2><!-- /.work-ttl -->
                <div class="work-subttl">
                    <h3 class="work-subttl-ttl">介護派遣事業会社 LP</h3><!-- /.work-subttl-ttl -->
                    <p class="work-subttl-txt">Coding</p><!-- /.work-subttl-txt -->
                </div><!-- /.work-subttl -->
                <img src="../images/work_caresend.png" alt="介護派遣事業会社 LP" class="work-img">
                <div class="work-data">
                    <div class="work-data-txt">
                        <p class="work-data-txt-period">制作期間：約1週間</p><!-- /.work-data-txt-period -->
                        <p class="work-data-txt-tool">使用ツール：Visual Studio Code</p><!-- /.work-data-txt-tool -->
                    </div><!-- /.work-data-txt -->
                    <a href="https://w-inagaki.github.io/caresend/index.html" target="_blank" class="work-data-btn">サイトを見る</a><!-- /.work-data-btn -->
                </div><!-- /.work-data -->
            </div><!-- /.work-inner -->
        </section><!-- /.work -->

        <section class="summary">
            <div class="summary-inner">
                <div class="summary-overview">
                    <div class="summary-ttl">
                        <h2 class="summary-ttl-ja">制作概要</h2><!-- /.summary-ttl-ja -->
                        <p class="summary-ttl-en">Project Overview</p><!-- /.summary-ttl-en -->
                    </div><!-- /.summary-ttl -->
                    <div class="summary-txt">
                        <p class="summary-txt-item">架空の介護派遣事業会社LPの制作</p>
                        <p class="summary-txt-item">専門学校在学中に、コーディング練習用として提供していただいたデザインカンプをもとに制作</p>
                        <p class="summary-txt-item">担当範囲：コーディング</p>
                        <p class="summary-txt-item">レスポンシブ対応（PC・スマートフォン）</p>
                    </div><!-- /.summary-txt -->
                </div><!-- /.summary-overview -->

                <div class="summary-topics">
                    <div class="summary-ttl">
                        <h2 class="summary-ttl-ja">工夫点</h2><!-- /.summary-ttl-ja -->
                        <p class="summary-ttl-en">Key Points</p><!-- /.summary-ttl-en -->
                    </div><!-- /.summary-ttl -->
                    <div class="summary-txt">
                        <p class="summary-txt-item">デザインカンプをもとに、余白や文字サイズ、配色などを意識しながら忠実に再現</p>
                    </div><!-- /.summary-topics-txt -->
                </div><!-- /.summary-topics -->


            </div><!-- /.summary-inner -->
        </section><!-- /.summary -->

        <footer class="footer">
            <small class="copyright">&copy; 2026 W.Inagaki</small>
        </footer>


    </div><!-- /.wrap -->

</html>
